<?xml version="1.0" encoding="UTF-8"?>
<!-- ClipDeck icon for small sizes (tray, taskbar, ico frames up to 64 px): the master (clipdeck-icon.svg)
     with a thicker frame and two bolder lines so the hollow board still reads at 16-24 px. -->
<svg id="clipdeck-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="ClipDeck">
  <defs>
    <linearGradient id="cd-aurora" gradientUnits="userSpaceOnUse" x1="72" y1="16" x2="440" y2="496">
      <stop offset="0" stop-color="#18B4E8"/>
      <stop offset="0.3" stop-color="#5B7CFA"/>
      <stop offset="0.55" stop-color="#9A5CF5"/>
      <stop offset="0.8" stop-color="#E9509A"/>
      <stop offset="1" stop-color="#FF8040"/>
    </linearGradient>
  </defs>

  <rect x="101.5" y="46" width="309" height="420" rx="70" fill="none" stroke="url(#cd-aurora)" stroke-width="60"/>
  <rect x="168" y="112" width="176" height="96" rx="32" fill="url(#cd-aurora)"/>
  <rect x="168" y="252" width="176" height="44" rx="22" fill="url(#cd-aurora)"/>
  <rect x="168" y="334" width="112" height="44" rx="22" fill="url(#cd-aurora)"/>
</svg>
