<?xml version="1.0" encoding="UTF-8"?>
<!-- ClipDeck app icon, 512x512 master. scripts/make-icon.py renders every icon file from it.
     No background tile: the board outline is a solid shape with a see-through middle (like the
     VS Code icon), so it sits cleanly on light and dark desktops and taskbars alike. -->
<svg id="clipdeck-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="ClipDeck">
  <defs>
    <!-- Aurora, top-left → bottom-right, deep enough to read on white -->
    <linearGradient id="cd-aurora" gradientUnits="userSpaceOnUse" x1="72" y1="16" x2="440" y2="496">
      <stop offset="0" stop-color="#18B4E8"/>
      <stop offset="0.3" stop-color="#5B7CFA"/>
      <stop offset="0.55" stop-color="#9A5CF5"/>
      <stop offset="0.8" stop-color="#E9509A"/>
      <stop offset="1" stop-color="#FF8040"/>
    </linearGradient>
  </defs>

  <!-- Board frame: thick outline, hollow (transparent) inside -->
  <rect x="93.5" y="38" width="325" height="436" rx="74" fill="none" stroke="url(#cd-aurora)" stroke-width="44"/>

  <!-- Button block in the upper half -->
  <rect x="150" y="100" width="212" height="86" rx="30" fill="url(#cd-aurora)"/>

  <!-- Content lines -->
  <rect x="152" y="238" width="208" height="30" rx="15" fill="url(#cd-aurora)"/>
  <rect x="152" y="300" width="208" height="30" rx="15" fill="url(#cd-aurora)"/>
  <rect x="152" y="362" width="130" height="30" rx="15" fill="url(#cd-aurora)"/>
</svg>
